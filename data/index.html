<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ksoloti Kontrol v1757857752</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="header-content">
                <h1>Ksoloti Kontrol v1757857752</h1>
                <div class="backup-controls">
                    <button id="export-presets" class="backup-btn export-btn">💾 Save to File</button>
                    <button id="import-presets" class="backup-btn import-btn">📁 Load from File</button>
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </div>
            </div>
        </header>

        <!-- Interface unifiée -->
        <div class="main-content">
            <section id="control-status" class="card">
                <h2>État Actuel & Couleur</h2>
                <div class="control-status-grid">
                    <div class="octave-controls">
                        <label>Octave:</label>
                        <button id="octave-down" class="btn btn-load">OCT-</button>
                        <span id="octave-display" class="octave-value">0</span>
                        <button id="octave-up" class="btn btn-load">OCT+</button>
                    </div>
                    <div class="preset-status">
                        <span id="current-preset-display" class="preset-value">P1</span>
                    </div>
                    <div class="color-picker-container">
                        <label for="color-picker">Couleur:</label>
                        <input type="color" id="color-picker" value="#ff0000">
                        <div class="rgb-values" style="display: none;">
                            <span>R: <span id="rgb-red-value">255</span></span>
                            <span>G: <span id="rgb-green-value">0</span></span>
                            <span>B: <span id="rgb-blue-value">0</span></span>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Section Presets intégrée dans Live Control -->
            <section id="presets" class="card">
                <h2>Presets Rapides</h2>
                <div class="presets-grid">
                    <div class="preset-group">
                        <label>Sauvegarder</label>
                        <div id="savePresetsContainer" class="preset-buttons">
                            <!-- Généré dynamiquement par JavaScript -->
                        </div>
                    </div>
                    <div class="preset-group">
                        <label>Charger</label>
                        <div id="loadPresetsContainer" class="preset-buttons">
                            <!-- Généré dynamiquement par JavaScript -->
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Section Filtres -->
            <section id="filters" class="card">
                <h2>Filtres</h2>
                <div class="filter-controls">
                    <div class="filter-row">
                        <label for="filter-cutoff">Cutoff</label>
                        <input type="range" id="filter-cutoff" class="fader" min="0" max="255" value="0">
                        <span class="value-display" id="filter-cutoff-value">0</span>
                    </div>
                    <div class="filter-row">
                        <label for="filter-reso">Résonance</label>
                        <input type="range" id="filter-reso" class="fader" min="0" max="255" value="0">
                        <span class="value-display" id="filter-reso-value">0</span>
                    </div>
                    <div class="filter-row">
                        <label>Mode Filtre</label>
                        <div class="filter-mode-controls">
                            <button class="btn-filter-mode" id="filter-hp" onclick="setFilterMode('HP')">HP</button>
                            <button class="btn-filter-mode" id="filter-bp" onclick="setFilterMode('BP')">BP</button>
                            <button class="btn-filter-mode" id="filter-lp" onclick="setFilterMode('LP')">LP</button>
                            <button class="btn-filter-mode active" id="filter-off" onclick="setFilterMode('OFF')">OFF</button>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Section Assignations intégrée -->
            <section id="assignments" class="card">
                <h2>Assignations Physiques</h2>
                <div class="assignments-grid" id="assignmentsGrid">
                    <!-- Généré dynamiquement par JavaScript -->
                </div>
            </section>

            <section id="parameters" class="card">
                <h2>Paramètres Live</h2>
                <div class="params-grid" id="paramsGrid">
                    <!-- Généré dynamiquement par JavaScript -->
                </div>
            </section>
        </div>

        <!-- Zone de statut -->
        <div id="status" class="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
