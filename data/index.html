<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ksoloti Kontrol v012</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="header-content">
                <h1>Ksoloti Kontrol v012</h1>
                <div class="view-toggle">
                    <button id="liveViewBtn" class="view-btn active">LIVE CONTROL</button>
                    <button id="configViewBtn" class="view-btn">CONFIG</button>
                </div>
            </div>
        </header>

        <!-- Vue LIVE CONTROL -->
        <div id="liveView" class="view active">
            <section id="octaves" class="card">
                <h2>Octaves</h2>
                <div class="octave-controls">
                    <button id="octave-down" class="btn btn-load">OCT-</button>
                    <span id="octave-display" class="octave-value">0</span>
                    <button id="octave-up" class="btn btn-load">OCT+</button>
                </div>
            </section>
            
            <!-- Section Presets intégrée dans Live Control -->
            <section id="presets" class="card">
                <h2>Presets Rapides</h2>
                <p class="preset-info">💡 <strong>Nouveau :</strong> Ces presets sont rappelables avec l'encodeur ! Preset 0 = mode web, presets 1-8 = vos créations.</p>
                <div class="presets-grid">
                    <div class="preset-group">
                        <label>Sauvegarder</label>
                        <div id="savePresetsContainer" class="preset-buttons">
                            <!-- Généré dynamiquement par JavaScript -->
                        </div>
                    </div>
                    <div class="preset-group">
                        <label>Charger</label>
                        <div id="loadPresetsContainer" class="preset-buttons">
                            <!-- Généré dynamiquement par JavaScript -->
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Section Filtres -->
            <section id="filters" class="card">
                <h2>Filtres</h2>
                <div class="filter-controls">
                    <div class="filter-row">
                        <label for="filter-cutoff">Cutoff</label>
                        <input type="range" id="filter-cutoff" class="fader" min="0" max="255" value="0">
                        <span class="value-display" id="filter-cutoff-value">0</span>
                    </div>
                    <div class="filter-row">
                        <label for="filter-reso">Résonance</label>
                        <input type="range" id="filter-reso" class="fader" min="0" max="255" value="0">
                        <span class="value-display" id="filter-reso-value">0</span>
                    </div>
                    <div class="filter-row">
                        <label for="filter-type">Type</label>
                        <input type="range" id="filter-type" class="fader" min="0" max="255" value="0">
                        <span class="value-display" id="filter-type-value">0</span>
                    </div>
                </div>
            </section>
            
            <!-- Section RGB -->
            <section id="rgb" class="card">
                <h2>Couleur RGB</h2>
                <div class="rgb-controls">
                    <div class="color-picker-container">
                        <label for="color-picker">Couleur:</label>
                        <input type="color" id="color-picker" value="#ff0000">
                        <div class="rgb-values">
                            <span>R: <span id="rgb-red-value">255</span></span>
                            <span>G: <span id="rgb-green-value">0</span></span>
                            <span>B: <span id="rgb-blue-value">0</span></span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="parameters" class="card">
                <h2>Paramètres Live</h2>
                <div class="params-grid" id="paramsGrid">
                    <!-- Généré dynamiquement par JavaScript -->
                </div>
            </section>
        </div>

        <!-- Vue CONFIG -->
        <div id="configView" class="view">
            <!-- Section Assignations -->
            <section id="assignments" class="card">
                <h2>Assignations Physiques</h2>
                <div class="assignments-grid" id="assignmentsGrid">
                    <!-- Généré dynamiquement par JavaScript -->
                </div>
            </section>
        </div>

        <!-- Zone de statut -->
        <div id="status" class="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
